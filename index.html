<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gontobbo | Bangladesh Trip Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #006a4e; /* Bangladesh Green */
            --secondary: #f42a41; /* Bangladesh Red */
        }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hero-font { font-family: 'Playfair Display', serif; }
        .bg-bd-green { background-color: var(--primary); }
        .text-bd-green { color: var(--primary); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .card-zoom:hover img { transform: scale(1.1); }
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-bd-green rounded-lg flex items-center justify-center">
                        <i class="fas fa-map-marked-alt text-white text-sm"></i>
                    </div>
                    <span class="text-2xl font-bold tracking-tighter text-bd-green">GONTOBBO</span>
                </div>
                <div class="hidden md:flex space-x-8 text-sm font-medium">
                    <a href="#" class="text-bd-green">Destinations</a>
                    <a href="#" class="hover:text-bd-green">Plan Trip</a>
                    <a href="#" class="hover:text-bd-green">Guides</a>
                </div>
                <button class="bg-bd-green text-white px-5 py-2 rounded-full text-sm font-semibold hover:opacity-90 transition-all">
                    Start Exploring
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative bg-slate-900 py-20 px-4 overflow-hidden">
        <div class="absolute inset-0 opacity-40">
            <img src="https://images.unsplash.com/photo-1596402184320-417d7178b2cd?auto=format&fit=crop&w=2000" class="w-full h-full object-cover" alt="Bangladesh Tea Garden">
        </div>
        <div class="relative max-w-4xl mx-auto text-center text-white">
            <h1 class="hero-font text-5xl md:text-7xl mb-6">Discover the soul of <span class="text-red-500">Bangladesh</span></h1>
            <p class="text-lg md:text-xl font-light mb-10 opacity-90">Architect your journey across 55 handpicked iconic destinations, from the clouds of Sajek to the corals of Saint Martin.</p>
            
            <!-- Search Bar -->
            <div class="flex flex-col md:flex-row bg-white rounded-2xl p-2 shadow-2xl max-w-3xl mx-auto">
                <div class="flex-1 flex items-center px-4 py-2 border-b md:border-b-0 md:border-r border-slate-100">
                    <i class="fas fa-search text-slate-400 mr-3"></i>
                    <input type="text" id="searchInput" placeholder="Where do you want to go?" class="w-full outline-none text-slate-700">
                </div>
                <div class="flex items-center px-4 py-2 min-w-[150px]">
                    <i class="fas fa-filter text-slate-400 mr-3"></i>
                    <select id="categoryFilter" class="w-full outline-none text-slate-700 bg-transparent cursor-pointer">
                        <option value="All">All Categories</option>
                        <option value="Hills">Hills</option>
                        <option value="Coastal">Coastal</option>
                        <option value="Heritage">Heritage</option>
                        <option value="Nature">Nature</option>
                        <option value="Adventure">Adventure</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-16">
        <div class="flex justify-between items-end mb-10">
            <div>
                <h2 class="text-3xl font-bold mb-2">Curated Destinations</h2>
                <p class="text-slate-500" id="resultCount">Showing all 55 locations</p>
            </div>
            <div class="flex gap-2">
                <button onclick="sortData('rating')" class="px-4 py-2 text-sm border rounded-lg hover:bg-slate-50">Top Rated</button>
                <button onclick="sortData('price')" class="px-4 py-2 text-sm border rounded-lg hover:bg-slate-50">Budget Friendly</button>
            </div>
        </div>

        <!-- Grid -->
        <div id="destinationsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards injected here -->
        </div>
    </main>

    <!-- Modal for Details -->
    <div id="detailModal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-10 w-10 h-10 bg-white/20 hover:bg-white/40 text-white rounded-full flex items-center justify-center backdrop-blur-md">
                <i class="fas fa-times"></i>
            </button>
            <div id="modalContent"></div>
        </div>
    </div>

    <footer class="bg-slate-900 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="opacity-60 text-sm">© 2024 Gontobbo Project. All Rights Reserved.</p>
            <div class="mt-4 flex justify-center gap-6 opacity-60">
                <i class="fab fa-facebook hover:text-white cursor-pointer"></i>
                <i class="fab fa-instagram hover:text-white cursor-pointer"></i>
                <i class="fab fa-twitter hover:text-white cursor-pointer"></i>
            </div>
        </div>
    </footer>

            { id: 52, name: "Patharghata", district: "Barguna", category: "Nature", rating: 4.5, price: 3200, highlights: ["Deer", "Forest", "Fish"], image: "https://images.unsplash.com/photo-1590001158193-7ae8a33637e9?w=600", description: "Where the forest meets the sea; you can often see deer wandering on the beach." },
            { id: 53, name: "Khadimnagar", district: "Sylhet", category: "Nature", rating: 4.4, price: 1200, highlights: ["Hiking", "Canopy", "Birds"], image: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=600", description: "A dense, small national park offering great jungle trails near the city." },
            { id: 54, name: "Varendra Museum", district: "Rajshahi", category: "Heritage", rating: 4.8, price: 400, highlights: ["Stone", "Statues", "Oldest"], image: "https://images.unsplash.com/photo-1566121316354-f064f268f270?w=600", description: "The oldest museum in the country, housing priceless stone artifacts of ancient Bengal." },
            { id: 55, name: "Somapura", district: "Naogaon", category: "Heritage", rating: 4.9, price: 1500, highlights: ["World Heritage", "Brick", "Grand"], image: "https://images.unsplash.com/photo-1589308454676-47665792f397?w=600", description: "The spectacular central shrine of Paharpur, a landmark of world Buddhist history." }
        ];

        let currentData = [...destinations];

        function renderGrid() {
            const grid = document.getElementById('destinationsGrid');
            const count = document.getElementById('resultCount');
            grid.innerHTML = '';
            
            currentData.forEach(dest => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all card-zoom cursor-pointer border border-slate-100 group";
                card.onclick = () => openModal(dest.id);
                card.innerHTML = `
                    <div class="relative h-64 overflow-hidden">
                        <img src="${dest.image}" class="w-full h-full object-cover transition-all duration-500" alt="${dest.name}">
                        <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold text-bd-green">
                            ${dest.category}
                        </div>
                        <div class="absolute bottom-4 right-4 bg-bd-green text-white px-3 py-1 rounded-lg text-sm font-bold">
                            ৳${dest.price}
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-xl font-bold group-hover:text-bd-green transition-all">${dest.name}</h3>
                            <div class="flex items-center text-amber-500 text-sm">
                                <i class="fas fa-star mr-1"></i> ${dest.rating}
                            </div>
                        </div>
                        <p class="text-slate-400 text-sm flex items-center mb-4">
                            <i class="fas fa-map-marker-alt mr-2"></i> ${dest.district}
                        </p>
                        <div class="flex flex-wrap gap-2 mt-auto">
                            ${dest.highlights.map(h => `<span class="bg-slate-50 text-slate-500 text-[10px] uppercase tracking-wider px-2 py-1 rounded">${h}</span>`).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            count.innerText = `Showing ${currentData.length} locations`;
        }

        function sortData(key) {
            currentData.sort((a, b) => b[key] - a[key]);
            if(key === 'price') currentData.reverse();
            renderGrid();
        }

        function openModal(id) {
            const dest = destinations.find(d => d.id === id);
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            
            content.innerHTML = `
                <div class="h-80 w-full overflow-hidden">
                    <img src="${dest.image}" class="w-full h-full object-cover">
                </div>
                <div class="p-8">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-bd-green font-bold tracking-widest text-xs uppercase">${dest.category}</span>
                        <div class="text-slate-400 text-sm italic">Est. Cost: ৳${dest.price}</div>
                    </div>
                    <h2 class="hero-font text-4xl font-bold mb-4">${dest.name}</h2>
                    <p class="text-slate-600 leading-relaxed mb-8 text-lg">${dest.description}</p>
                    
                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="bg-slate-50 p-4 rounded-2xl">
                            <h4 class="text-xs font-bold text-slate-400 uppercase mb-2">Location</h4>
                            <p class="font-semibold">${dest.district}, BD</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl">
                            <h4 class="text-xs font-bold text-slate-400 uppercase mb-2">Rating</h4>
                            <p class="font-semibold text-amber-600"><i class="fas fa-star mr-1"></i> ${dest.rating}/5.0</p>
                        </div>
                    </div>

                    <h4 class="font-bold mb-4">Must Experience</h4>
                    <div class="flex flex-wrap gap-3 mb-8">
                        ${dest.highlights.map(h => `
                            <div class="flex items-center bg-green-50 text-bd-green px-4 py-2 rounded-xl text-sm border border-green-100">
                                <i class="fas fa-check-circle mr-2"></i> ${h}
                            </div>
                        `).join('')}
                    </div>

                    <button class="w-full bg-bd-green text-white py-4 rounded-2xl font-bold hover:shadow-lg transition-all">
                        Architect This Trip
                    </button>
                </div>
            `;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Filter Logic
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            currentData = destinations.filter(d => 
                d.name.toLowerCase().includes(term) || 
                d.district.toLowerCase().includes(term)
            );
            renderGrid();
        });

        document.getElementById('categoryFilter').addEventListener('change', (e) => {
            const cat = e.target.value;
            currentData = cat === "All" ? [...destinations] : destinations.filter(d => d.category === cat);
            renderGrid();
        });

        // Initialize
        window.onload = renderGrid;
    </script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
